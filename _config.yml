title: "Margens da Pólis"
description: "Publicação independente sobre sociedade, poder, cultura e ideias."
url: "https://gmonteiropolli-design.github.io"
baseurl: "/Margens-da-Polis"
lang: "pt-PT"
timezone: "Europe/Lisbon"
markdown: kramdown
permalink: /artigos/:year/:month/:day/:title/
paginate: 8
plugins: []
exclude:
  - README.md
  - .pages.yml
  - Gemfile
  - Gemfile.lock
  - vendor
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Autor"
      lang: "pt-PT"
