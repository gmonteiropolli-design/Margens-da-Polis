media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: posts
    label: Artigos
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, categories, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Data de publicação
        type: date
        required: true
      - name: categories
        label: Secção
        type: select
        options:
          values:
            - Sociedade e Poder
            - Cultura e Ideias
            - Cadernos
      - name: author
        label: Autor
        type: string
        default: "Giulia Polli"
      - name: description
        label: Resumo / linha fina
        type: text
      - name: image
        label: Imagem de destaque
        type: image
      - name: image_alt
        label: Descrição da imagem
        type: string
      - name: image_caption
        label: Legenda da imagem
        type: string
      - name: image_credit
        label: Crédito da imagem
        type: string
      - name: from_archive
        label: Publicar em Do Arquivo
        type: boolean
      - name: featured
        label: Destacar na página inicial
        type: boolean
      - name: dossier
        label: Incluir no Dossiê da semana
        type: boolean
      - name: weekly_highlight
        label: Incluir em Destaques da Semana
        type: boolean
      - name: news_source_name
        label: Fonte da notícia
        type: string
      - name: news_source_url
        label: Ligação para a notícia original
        type: string
      - name: temas
        label: Temas (separar por vírgulas)
        type: string
      - name: body
        label: Texto do artigo
        type: rich-text

  - name: about
    label: Sobre
    type: file
    path: sobre.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        label: Título da página
        type: string
      - name: description
        label: Descrição
        type: text
      - name: body
        label: Texto da página
        type: rich-text
        options:
          format: html
          switcher: false

  - name: pages
    label: Páginas
    type: collection
    path: pages
    exclude: ["index.md"]
    fields:
      - name: title
        label: Título
        type: string
      - name: body
        label: Conteúdo
        type: rich-text

settings:
  content:
    merge: true
